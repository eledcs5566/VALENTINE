<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b9e8e8">
<title>riyas fish ♡</title>
<style>
  :root {
    --deep: #285c68;
    --ink: #315d68;
    --water: #c8f0ed;
    --foam: #f5ffff;
    --coral: #f5a8a0;
    --lavender: #d9d4f4;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #e7fbf8 0%, #c9f0ed 48%, #a8dce0 100%);
    overflow-x: hidden;
  }
  .scene {
    min-height: 100svh;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: 34px 18px 70px;
  }
  .sunlight {
    position: absolute; inset: -10% -20% auto;
    height: 65%; z-index: -1; pointer-events: none;
    background: repeating-conic-gradient(from 205deg at 50% 0%, transparent 0 8deg, #fff8 9deg 12deg, transparent 13deg 22deg);
    filter: blur(18px); opacity: .5;
  }
  .caustics {
    position: absolute; inset: 0; z-index: -1; opacity: .18;
    background-image: radial-gradient(ellipse at 20% 25%, white 0 2px, transparent 3px),
      radial-gradient(ellipse at 75% 35%, white 0 3px, transparent 4px),
      radial-gradient(ellipse at 45% 70%, white 0 2px, transparent 3px);
    background-size: 150px 130px, 210px 180px, 180px 160px;
  }
  .card {
    width: min(100%, 510px);
    min-height: 650px;
    position: relative;
    overflow: hidden;
    border: 1px solid #ffffffa8;
    border-radius: 34px;
    background: linear-gradient(180deg, #f4ffffb8, #d9f7f3a8 70%, #b8e8e6b8);
    box-shadow: 0 24px 70px #397b8050, inset 0 0 35px #ffffff9c;
    display: flex; flex-direction: column; align-items: center;
    padding: 42px 22px 30px;
    text-align: center;
    backdrop-filter: blur(8px);
  }
  .tiny { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #65939a; }
  h1 {
    margin: 12px 0 7px;
    color: #316d78;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 10vw, 57px);
    font-weight: 500;
    letter-spacing: -.045em;
    text-shadow: 0 2px 0 #fff9;
  }
  .subtitle { margin: 0; font-size: 14px; color: #648d93; letter-spacing: .04em; }
  .tank {
    width: 100%; height: 315px; position: relative; margin: 28px 0 10px;
    border-radius: 25px;
    border: 2px solid #ffffffbd;
    background: linear-gradient(180deg, #a8e3e5a1, #8bd0d5a8 60%, #75bfc8b5);
    box-shadow: inset 0 0 35px #ffffff80, 0 9px 22px #4b92933a;
    overflow: hidden;
  }
  .tank:before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, #fff8, transparent 28% 70%, #fff4);
    pointer-events: none;
  }
  .sand {
    position: absolute; bottom: -20px; left: -5%; width: 110%; height: 62px;
    border-radius: 50% 50% 0 0;
    background: linear-gradient(#e7d8b8, #d8c7a7);
    opacity: .9;
  }
  .plant { position: absolute; bottom: 27px; width: 80px; height: 125px; }
  .plant.left { left: 14px; }
  .plant.right { right: 9px; transform: scale(.8); }
  .stem { position: absolute; bottom: 0; left: 50%; width: 4px; height: 100px; background: #579d83; border-radius: 50%; transform: rotate(8deg); }
  .leaf { position: absolute; bottom: 30px; left: 16px; width: 25px; height: 48px; background: #72b99a; border-radius: 100% 0 100% 0; transform: rotate(-28deg); }
  .leaf.two { left: 39px; bottom: 58px; transform: rotate(28deg) scale(.85); background: #8bc9a8; }
  .leaf.three { left: 2px; bottom: 78px; transform: rotate(-45deg) scale(.7); background: #65aa8c; }
  .pebble { position: absolute; bottom: 22px; width: 16px; height: 9px; border-radius: 50%; background: #fff8; }
  .p1 { left: 115px; } .p2 { right: 110px; width: 22px; }
  .fish {
    position: absolute; left: -100px; top: 42%;
    font-size: 62px; line-height: 1;
    filter: drop-shadow(0 5px 4px #3a7e8240);
    animation: swim 13s linear infinite;
    transform: scaleX(-1);
  }
  .fish.second {
    top: 22%; font-size: 34px; opacity: .8;
    animation: swimBack 17s linear infinite 2s;
  }
  @keyframes swim { 0% { left: -85px; transform: scaleX(-1) translateY(0); } 48% { transform: scaleX(-1) translateY(-17px); } 50% { left: calc(100% + 20px); transform: scaleX(1) translateY(-12px); } 100% { left: -85px; transform: scaleX(1) translateY(0); } }
  @keyframes swimBack { 0% { right: -60px; left: auto; transform: scaleX(1) translateY(0); } 49% { transform: scaleX(1) translateY(13px); } 50% { right: auto; left: calc(100% + 10px); transform: scaleX(-1) translateY(8px); } 100% { left: -60px; transform: scaleX(-1) translateY(0); } }
  .bubble {
    position: absolute; bottom: -25px; width: 11px; height: 11px; border: 1.5px solid #efffffcc;
    border-radius: 50%; background: #ffffff28;
    animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-370px) translateX(18px); opacity: 0; } }
  .bubble:nth-child(1) { left: 18%; animation-duration: 7s; }
  .bubble:nth-child(2) { left: 32%; width: 7px; height: 7px; animation-duration: 9s; animation-delay: 2s; }
  .bubble:nth-child(3) { left: 58%; animation-duration: 8s; animation-delay: 1s; }
  .bubble:nth-child(4) { left: 77%; width: 15px; height: 15px; animation-duration: 10s; animation-delay: 3s; }
  .bubble:nth-child(5) { left: 89%; width: 6px; height: 6px; animation-duration: 6s; animation-delay: 1s; }
  .message { font-family: Georgia, serif; font-size: 18px; color: #527f86; margin: 14px 0 0; }
  .heart { color: #e99caa; display: inline-block; animation: beat 1.5s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.25); } }
  .hint { margin-top: 18px; font-size: 11px; color: #71999e; letter-spacing: .08em; }
  .button {
    margin-top: 15px; border: 1px solid #ffffffd9; border-radius: 999px;
    background: #ffffff75; color: #477982; padding: 10px 19px;
    font: inherit; font-size: 13px; cursor: pointer;
    box-shadow: 0 4px 12px #57969a20;
  }
  .button:active { transform: scale(.97); }
  .bottom-note { position: absolute; bottom: 16px; font-size: 11px; color: #6a999d; letter-spacing: .08em; }
  @media (max-height: 760px) { .card { min-height: 590px; padding-top: 28px; } .tank { height: 275px; margin-top: 20px; } }
  @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<main class="scene">
  <div class="sunlight"></div><div class="caustics"></div>
  <section class="card" aria-label="A little aquarium for Riya">
    <div class="tiny">a little underwater world</div>
    <h1>riyas fish</h1>
    <p class="subtitle">a tiny aquarium, just for you ♡</p>
    <div class="tank" id="tank">
      <div class="plant left"><i class="stem"></i><i class="leaf"></i><i class="leaf two"></i><i class="leaf three"></i></div>
      <div class="plant right"><i class="stem"></i><i class="leaf"></i><i class="leaf two"></i><i class="leaf three"></i></div>
      <span class="pebble p1"></span><span class="pebble p2"></span>
      <div class="fish" aria-label="A little fish">🐠</div>
      <div class="fish second" aria-hidden="true">🐟</div>
      <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
      <div class="sand"></div>
    </div>
    <p class="message">Just keep swimming, pretty girl <span class="heart">♥</span></p>
    <button class="button" id="feed">drop a little fish food ✧</button>
    <div class="hint">made with a little love & lots of bubbles</div>
  </section>
  <div class="bottom-note">✦ breathe in · float on · be happy ✦</div>
</main>
<script>
  const tank = document.getElementById('tank');
  document.getElementById('feed').addEventListener('click', () => {
    for (let i = 0; i < 12; i++) {
      const food = document.createElement('span');
      food.textContent = '·';
      food.style.cssText = `position:absolute;top:18px;left:${15 + Math.random()*70}%;font-size:24px;color:#fff9;z-index:4;animation:foodfall ${1.8+Math.random()*1.2}s ease-in forwards;`;
      tank.appendChild(food);
      setTimeout(() => food.remove(), 3200);
    }
  });
  const style = document.createElement('style');
  style.textContent = '@keyframes foodfall { to { transform:translateY(210px); opacity:0; } }';
  document.head.appendChild(style);
</script>
</body>
</html>
